spring:
  datasource:
    url: jdbc:h2:file:./data/hongik-graduate
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
app:
  auth:
    jwt-secret: ${JWT_SECRET:}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:1209600000}
    email-verification-expiration: ${EMAIL_VERIFICATION_EXPIRATION:600000}
    email-verification-resend-interval: ${EMAIL_VERIFICATION_RESEND_INTERVAL:60000}
    email-verification-max-attempts: ${EMAIL_VERIFICATION_MAX_ATTEMPTS:5}
    mail-from: ${MAIL_FROM:no-reply@hongik-graduate.local}

server:
  port: 8081

logging:
  level:
    com.hongik.graduate: DEBUG
